name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no stored token
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Tests
        run: uv run --no-default-groups --group dev pytest -q
      - name: Build
        run: uv build
      - name: Wheel bundles the data
        run: unzip -l dist/*.whl | grep -q "fow_cache/data/conv-long/"
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    environment: npm   # must match the trusted publisher's environment on npmjs.com
    permissions:
      id-token: write  # npm trusted publishing (OIDC): no stored token
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm with staged publishing (11.15+)
        run: npm install -g npm@11.21.0
      - name: Tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      # The trusted publisher allows staging only: the release waits for a maintainer to
      # approve it with 2FA (npmjs.com, or `npm stage approve <stage-id>`) before going live.
      - run: npm stage publish . --access public --provenance
      - name: Approval reminder
        run: echo "::notice::fow-cache $GITHUB_REF_NAME is staged on npm. Approve it on npmjs.com (package settings) or with npm stage approve to make it live."
